name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixvo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Comprobar que no haya secretos versionados
        run: npm run check:secrets

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Validar código
        run: npm run lint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  build-seo:
    name: Build y SEO
    needs:
      - secrets
      - lint
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Construir y auditar el sitio
        run: npm run build

      - name: Ejecutar QA SEO integral
        run: npm run check:seo

      - name: Subir el build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy a Hostinger
    needs: build-seo
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Descargar el build generado
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Desplegar por FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ vars.HOSTINGER_FTP_SERVER_DIR || '/public_html/' }}
          local-dir: ./dist/
          dangerous-clean-slate: false
